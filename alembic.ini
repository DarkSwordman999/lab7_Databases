# Настройки Alembic (повышенное задание №3: миграции).
#
# Путь к базе можно переопределить:
#   alembic -x db=sqlite:///other.db upgrade head
# или переменной окружения DATABASE_URL.

[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url = sqlite:///school.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
